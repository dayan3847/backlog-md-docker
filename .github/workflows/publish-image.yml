# Builds the image for amd64 and arm64 and publishes it to GHCR, tagged with the Backlog.md version the
# Dockerfile pins. Run by hand from the Actions tab after changing the image.
name: Publish image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # The command pins the image by version: publishing one it does not use would leave it on the old image.
      - name: Read the pinned version
        id: version
        run: |
          version="$(sed -n 's/^ARG BACKLOG_VERSION=//p' Dockerfile)"
          image="ghcr.io/${GITHUB_REPOSITORY,,}:$version"
          grep -qF "image=\"$image\"" backlog-md-docker \
            || { echo "::error::backlog-md-docker does not pin $image"; exit 1; }
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The arm64 build runs its RUN steps under emulation.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.version.outputs.image }}
